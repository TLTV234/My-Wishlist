<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Coffee Diary ☕</title>


    <style>

        /* =====================================================
           COLOR
        ===================================================== */

        :root {

            --cream: #F8F1E7;
            --cream-light: #FFFDF8;

            --beige: #EADCC8;
            --beige-dark: #D8C3A9;

            --brown: #6F4E37;
            --brown-dark: #4B3425;
            --brown-light: #A67C52;

            --yellow: #F4DFA6;
            --yellow-light: #FFF4CE;

            --pink: #E8B8A8;
            --pink-light: #F7DDD6;

            --green: #B9C8A8;

            --white: #FFFFFF;

            --gray: #80766C;
            --gray-light: #E5DED5;

            --danger: #C97968;

            --shadow:
                0 8px 25px rgba(111, 78, 55, 0.10);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            box-sizing: border-box;

            margin: 0;
            padding: 0;

        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background: var(--cream);

            color: var(--brown-dark);

            min-height: 100vh;

        }


        button,
        input,
        textarea,
        select {

            font-family: inherit;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            background:
                linear-gradient(
                    135deg,
                    #F8F1E7,
                    #F3E2C5
                );

            padding:
                28px 6% 22px;

            border-bottom:
                1px solid
                rgba(111,78,55,0.08);

        }


        .header-content {

            max-width: 1250px;

            margin: auto;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

        }


        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .logo-icon {

            width: 52px;
            height: 52px;

            border-radius: 17px;

            background:
                var(--brown);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            box-shadow:
                0 6px 16px
                rgba(111,78,55,0.20);

        }


        .logo h1 {

            font-size: 25px;

            color:
                var(--brown-dark);

        }


        .logo p {

            font-size: 13px;

            color:
                var(--gray);

            margin-top: 3px;

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {

            border: none;

            border-radius: 13px;

            padding:
                12px 18px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform .12s ease,
                box-shadow .15s ease,
                filter .15s ease;

        }


        .btn:hover {

            filter: brightness(1.03);

            transform:
                translateY(-2px);

        }


        .btn:active {

            transform:
                translateY(2px)
                scale(.97);

            box-shadow:
                0 2px 5px
                rgba(0,0,0,.15);

        }


        .btn-add {

            background:
                var(--brown);

            color: white;

            box-shadow:
                0 6px 15px
                rgba(111,78,55,.20);

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            max-width: 1250px;

            margin: auto;

            padding:
                30px 6% 60px;

        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 16px;

            margin-bottom: 28px;

        }


        .stat-card {

            background:
                rgba(255,255,255,.65);

            border-radius: 18px;

            padding:
                18px 20px;

            box-shadow:
                var(--shadow);

        }


        .stat-number {

            font-size: 28px;

            font-weight: 700;

            color:
                var(--brown);

        }


        .stat-label {

            font-size: 13px;

            color:
                var(--gray);

            margin-top: 3px;

        }


        /* =====================================================
           SEARCH / FILTER
        ===================================================== */

        .tools {

            background:
                var(--cream-light);

            padding: 20px;

            border-radius: 20px;

            display: grid;

            grid-template-columns:
                2fr 1fr 1fr 1fr;

            gap: 12px;

            margin-bottom: 25px;

            box-shadow:
                var(--shadow);

        }


        .input,
        select,
        textarea {

            width: 100%;

            border:
                1px solid
                #DDCDB9;

            background: white;

            border-radius: 12px;

            padding:
                12px 14px;

            outline: none;

            color:
                var(--brown-dark);

            transition:
                border .2s,
                box-shadow .2s;

        }


        .input:focus,
        select:focus,
        textarea:focus {

            border-color:
                var(--brown-light);

            box-shadow:
                0 0 0 3px
                rgba(166,124,82,.12);

        }


        /* =====================================================
           TABS
        ===================================================== */

        .tabs {

            display: flex;

            gap: 10px;

            overflow-x: auto;

            padding-bottom: 10px;

            margin-bottom: 22px;

        }


        .tab {

            white-space: nowrap;

            border: none;

            padding:
                11px 17px;

            border-radius: 30px;

            background:
                #E8D9C5;

            color:
                var(--brown-dark);

            cursor: pointer;

            font-weight: 600;

            transition: .15s;

        }


        .tab:hover {

            transform:
                translateY(-2px);

        }


        .tab.active {

            background:
                var(--brown);

            color: white;

            box-shadow:
                0 5px 12px
                rgba(111,78,55,.18);

        }


        /* =====================================================
           COFFEE GRID
        ===================================================== */

        .coffee-grid {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 22px;

        }


        /* =====================================================
           CARD
        ===================================================== */

        .coffee-card {

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                var(--shadow);

            transition:
                transform .2s,
                box-shadow .2s;

            position: relative;

        }


        .coffee-card:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 14px 30px
                rgba(111,78,55,.15);

        }


        /* =====================================================
           COVER
        ===================================================== */

        .cover-wrapper {

            width: 100%;

            height: 210px;

            position: relative;

            background:
                linear-gradient(
                    135deg,
                    #E8D5BC,
                    #F5E9D6
                );

            overflow: hidden;

        }


        .cover-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }


        .no-image {

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 55px;

        }


        .favorite-btn {

            position: absolute;

            top: 12px;

            right: 12px;

            width: 40px;

            height: 40px;

            border-radius: 50%;

            border: none;

            background:
                rgba(255,255,255,.92);

            cursor: pointer;

            font-size: 20px;

            transition: .15s;

            z-index: 5;

        }


        .favorite-btn:hover {

            transform:
                scale(1.1);

        }


        /* =====================================================
           ALBUM
        ===================================================== */

        .album {

            display: flex;

            gap: 6px;

            padding: 8px 12px;

            background:
                #FBF7F0;

            overflow-x: auto;

        }


        .album-thumb {

            width: 48px;

            height: 48px;

            flex-shrink: 0;

            border-radius: 8px;

            object-fit: cover;

            cursor: pointer;

            border:
                2px solid
                transparent;

            transition: .15s;

        }


        .album-thumb:hover {

            border-color:
                var(--brown);

            transform:
                scale(1.05);

        }


        /* =====================================================
           CARD BODY
        ===================================================== */

        .card-body {

            padding: 18px;

        }


        .card-title {

            font-size: 19px;

            font-weight: 700;

            color:
                var(--brown-dark);

            margin-bottom: 7px;

        }


        .location {

            color:
                var(--gray);

            font-size: 13px;

            margin-bottom: 10px;

        }


        .rating {

            color:
                #D39C2F;

            font-size: 14px;

            margin-bottom: 12px;

        }


        .rating-number {

            color:
                var(--gray);

            margin-left: 4px;

        }


        .tag {

            display: inline-block;

            padding:
                5px 9px;

            border-radius: 20px;

            font-size: 11px;

            background:
                var(--yellow-light);

            color:
                var(--brown);

        }


        .note {

            color:
                #665A50;

            font-size: 14px;

            line-height: 1.55;

            margin-top: 12px;

        }


        /* =====================================================
           MENU IMAGE
        ===================================================== */

        .menu-section {

            margin-top: 14px;

        }


        .menu-title {

            font-size: 13px;

            font-weight: 700;

            color:
                var(--brown);

            margin-bottom: 8px;

        }


        .menu-images {

            display: flex;

            gap: 7px;

            overflow-x: auto;

        }


        .menu-image {

            width: 75px;

            height: 75px;

            object-fit: cover;

            border-radius: 9px;

            cursor: pointer;

            border:
                1px solid
                var(--beige);

        }


        /* =====================================================
           ACTIONS
        ===================================================== */

        .card-actions {

            display: flex;

            gap: 8px;

            margin-top: 15px;

        }


        .small-btn {

            flex: 1;

            padding: 9px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-weight: 600;

            transition: .12s;

        }


        .small-btn:active {

            transform:
                scale(.96);

        }


        .edit-btn {

            background:
                var(--beige);

            color:
                var(--brown-dark);

        }


        .delete-btn {

            background:
                var(--pink-light);

            color:
                #87483D;

        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .empty {

            text-align: center;

            padding:
                60px 20px;

            color:
                var(--gray);

            grid-column:
                1 / -1;

        }


        .empty-icon {

            font-size: 50px;

            margin-bottom: 10px;

        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(75,52,37,.45);

            z-index: 1000;

            padding: 20px;

            align-items: center;

            justify-content: center;

        }


        .modal.show {

            display: flex;

        }


        .modal-content {

            width:
                min(700px,100%);

            max-height:
                92vh;

            overflow-y: auto;

            background:
                var(--cream-light);

            border-radius: 24px;

            padding: 28px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,.20);

            animation:
                modalIn .2s ease;

        }


        @keyframes modalIn {

            from {

                opacity: 0;

                transform:
                    scale(.96);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .modal-header h2 {

            color:
                var(--brown-dark);

        }


        .close {

            border: none;

            background:
                var(--beige);

            width: 36px;

            height: 36px;

            border-radius: 50%;

            cursor: pointer;

            font-size: 18px;

        }


        .form-group {

            margin-bottom: 15px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color:
                var(--brown);

        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

        }


        .form-actions {

            display: flex;

            gap: 10px;

            justify-content: flex-end;

            margin-top: 20px;

        }


        .btn-cancel {

            background:
                var(--beige);

            color:
                var(--brown-dark);

        }


        .btn-save {

            background:
                var(--brown);

            color: white;

        }


        /* =====================================================
           STAR
        ===================================================== */

        .stars-input {

            display: flex;

            gap: 5px;

        }


        .star {

            border: none;

            background: transparent;

            font-size: 28px;

            color:
                #D7CBBE;

            cursor: pointer;

            transition: .1s;

        }


        .star.selected,
        .star:hover {

            color:
                #D39C2F;

            transform:
                scale(1.1);

        }


        /* =====================================================
           IMAGE PREVIEW
        ===================================================== */

        .preview-title {

            font-size: 12px;

            color:
                var(--gray);

            margin:
                8px 0;

        }


        .image-preview {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

        }


        .preview-box {

            width: 80px;

            height: 80px;

            border-radius: 10px;

            overflow: hidden;

            position: relative;

            border:
                1px solid
                var(--beige-dark);

        }


        .preview-box img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        /* =====================================================
           IMAGE VIEWER
        ===================================================== */

        .image-viewer {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(35,25,18,.88);

            z-index: 2000;

            align-items: center;

            justify-content: center;

            padding: 25px;

        }


        .image-viewer.show {

            display: flex;

        }


        .viewer-image {

            max-width: 92vw;

            max-height: 88vh;

            object-fit: contain;

            border-radius: 12px;

        }


        .viewer-close {

            position: fixed;

            top: 20px;

            right: 25px;

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background:
                white;

            font-size: 22px;

            cursor: pointer;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            text-align: center;

            color:
                var(--gray);

            font-size: 12px;

            padding: 20px;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width:900px) {

            .coffee-grid {

                grid-template-columns:
                    repeat(2,1fr);

            }


            .tools {

                grid-template-columns:
                    repeat(2,1fr);

            }


            .stats {

                grid-template-columns:
                    repeat(2,1fr);

            }

        }


        @media(max-width:600px) {

            .header-content {

                flex-direction: column;

                align-items:
                    flex-start;

            }


            .coffee-grid {

                grid-template-columns: 1fr;

            }


            .tools {

                grid-template-columns: 1fr;

            }


            .stats {

                grid-template-columns:
                    repeat(2,1fr);

            }


            .form-row {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="header-content">

        <div class="logo">

            <div class="logo-icon">
                ☕
            </div>

            <div>

                <h1>
                    My Coffee Diary
                </h1>

                <p>
                    Những quán cà phê mình đã đi ♡
                </p>

            </div>

        </div>


        <button
            class="btn btn-add"
            onclick="openModal()"
        >
            ＋ Thêm quán
        </button>

    </div>

</header>



<main>


<!-- =========================================================
     STATISTICS
========================================================= -->

<section class="stats">

    <div class="stat-card">

        <div
            class="stat-number"
            id="totalCount"
        >
            0
        </div>

        <div class="stat-label">
            ☕ Tổng số quán
        </div>

    </div>


    <div class="stat-card">

        <div
            class="stat-number"
            id="visitedCount"
        >
            0
        </div>

        <div class="stat-label">
            📍 Đã đi
        </div>

    </div>


    <div class="stat-card">

        <div
            class="stat-number"
            id="favoriteCount"
        >
            0
        </div>

        <div class="stat-label">
            ❤️ Yêu thích
        </div>

    </div>


    <div class="stat-card">

        <div
            class="stat-number"
            id="wishlistCount"
        >
            0
        </div>

        <div class="stat-label">
            ✨ Wishlist
        </div>

    </div>

</section>



<!-- =========================================================
     SEARCH + FILTER
========================================================= -->

<section class="tools">

    <input
        id="searchInput"
        class="input"
        type="text"
        placeholder="🔍 Tìm tên quán, địa điểm, menu, ghi chú..."
        oninput="renderCafes(false)"
    >


    <select
        id="cityFilter"
        onchange="handleCityChange()"
    >

        <option value="">
            Tất cả thành phố
        </option>

    </select>


    <select
        id="districtFilter"
        onchange="handleDistrictChange()"
    >

        <option value="">
            Tất cả quận
        </option>

    </select>


    <select
        id="wardFilter"
        onchange="renderCafes(false)"
    >

        <option value="">
            Tất cả phường
        </option>

    </select>

</section>



<!-- =========================================================
     CATEGORIES
========================================================= -->

<section class="tabs">

    <button
        class="tab active"
        onclick="changeCategory('all',this)"
    >
        ☕ Tất cả
    </button>


    <button
        class="tab"
        onclick="changeCategory('visited',this)"
    >
        📍 Quán đã đi
    </button>


    <button
        class="tab"
        onclick="changeCategory('wishlist',this)"
    >
        ✨ Wishlist
    </button>


    <button
        class="tab"
        onclick="changeCategory('avoid',this)"
    >
        🚫 Không nên đi
    </button>


    <button
        class="tab"
        onclick="changeCategory('favorite',this)"
    >
        ❤️ Quán yêu thích
    </button>

</section>



<!-- =========================================================
     COFFEE LIST
========================================================= -->

<section
    class="coffee-grid"
    id="coffeeGrid"
></section>


</main>



<footer>

    Made with ☕ & ♡

</footer>



<!-- =========================================================
     ADD / EDIT MODAL
========================================================= -->

<div
    class="modal"
    id="coffeeModal"
>

    <div class="modal-content">


        <div class="modal-header">

            <h2 id="modalTitle">
                Thêm quán cà phê
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>



        <form id="coffeeForm">


            <input
                type="hidden"
                id="editId"
            >


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Tên quán *
                </label>

                <input
                    class="input"
                    id="name"
                    required
                    placeholder="Ví dụ: The Workshop Coffee"
                >

            </div>



            <!-- CITY / DISTRICT -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Thành phố *
                    </label>

                    <input
                        class="input"
                        id="city"
                        required
                        placeholder="Ví dụ: Hồ Chí Minh"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Quận *
                    </label>

                    <input
                        class="input"
                        id="district"
                        required
                        placeholder="Ví dụ: Quận 1"
                    >

                </div>

            </div>



            <!-- WARD -->

            <div class="form-group">

                <label>
                    Phường
                </label>

                <input
                    class="input"
                    id="ward"
                    placeholder="Ví dụ: Phường Bến Nghé"
                >

            </div>



            <!-- PAGE -->

            <div class="form-group">

                <label>
                    Page / Website / Instagram
                </label>

                <input
                    class="input"
                    id="page"
                    placeholder="https://..."
                >

            </div>



            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Phân loại
                </label>

                <select
                    id="category"
                    class="input"
                >

                    <option value="visited">
                        📍 Quán đã đi
                    </option>

                    <option value="wishlist">
                        ✨ Wishlist
                    </option>

                    <option value="avoid">
                        🚫 Không nên đi
                    </option>

                </select>

            </div>



            <!-- RATING -->

            <div class="form-group">

                <label>
                    Đánh giá
                </label>


                <div class="stars-input">

                    <button
                        type="button"
                        class="star"
                        data-value="1"
                        onclick="setRating(1)"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="2"
                        onclick="setRating(2)"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="3"
                        onclick="setRating(3)"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="4"
                        onclick="setRating(4)"
                    >
                        ★
                    </button>

                    <button
                        type="button"
                        class="star"
                        data-value="5"
                        onclick="setRating(5)"
                    >
                        ★
                    </button>

                </div>

            </div>



            <!-- MENU IMAGES -->

            <div class="form-group">

                <label>
                    Hình ảnh Menu
                </label>

                <input
                    class="input"
                    type="file"
                    id="menuImages"
                    accept="image/*"
                    multiple
                >

                <div class="preview-title">
                    Có thể chọn nhiều ảnh menu.
                </div>

                <div
                    class="image-preview"
                    id="menuPreview"
                ></div>

            </div>



            <!-- NOTE -->

            <div class="form-group">

                <label>
                    Ghi chú
                </label>

                <textarea
                    id="note"
                    rows="4"
                    placeholder="Không gian, món ngon, giá cả, cảm nhận..."
                ></textarea>

            </div>



            <!-- COVER -->

            <div class="form-group">

                <label>
                    🖼️ Ảnh bìa
                </label>

                <input
                    class="input"
                    type="file"
                    id="coverImage"
                    accept="image/*"
                >

                <div class="preview-title">
                    Ảnh bìa sẽ hiển thị lớn nhất trên thẻ quán.
                </div>

                <div
                    class="image-preview"
                    id="coverPreview"
                ></div>

            </div>



            <!-- ALBUM -->

            <div class="form-group">

                <label>
                    📸 Album ảnh của quán
                </label>

                <input
                    class="input"
                    type="file"
                    id="galleryImages"
                    accept="image/*"
                    multiple
                >

                <div class="preview-title">

                    Tối đa
                    <strong>8 ảnh</strong>
                    cho mỗi quán.

                </div>

                <div
                    class="image-preview"
                    id="galleryPreview"
                ></div>

            </div>



            <!-- ACTIONS -->

            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-cancel"
                    onclick="closeModal()"
                >
                    Hủy
                </button>


                <button
                    type="submit"
                    class="btn btn-save"
                >
                    Lưu quán ☕
                </button>

            </div>


        </form>

    </div>

</div>



<!-- =========================================================
     IMAGE VIEWER
========================================================= -->

<div
    class="image-viewer"
    id="imageViewer"
>

    <button
        class="viewer-close"
        onclick="closeImageViewer()"
    >
        ×
    </button>


    <img
        class="viewer-image"
        id="viewerImage"
        src=""
        alt="Coffee image"
    >

</div>



<script>


/* ============================================================
   DATA
============================================================ */


let cafes =
    JSON.parse(
        localStorage.getItem(
            "myCoffeeDiary"
        )
    ) || [];


let currentCategory = "all";

let currentRating = 0;


/*
    Các ảnh mới được chọn trong form
*/

let selectedCover = "";

let selectedGallery = [];

let selectedMenuImages = [];


/*
    Nếu dữ liệu cũ từ phiên bản trước
    chưa có gallery/menuImages/coverImage
    thì tự bổ sung.
*/

cafes =
    cafes.map(cafe => ({

        ...cafe,

        coverImage:
            cafe.coverImage ||
            cafe.image ||
            "",

        gallery:
            Array.isArray(cafe.gallery)
                ? cafe.gallery
                : [],

        menuImages:
            Array.isArray(cafe.menuImages)
                ? cafe.menuImages
                : []

    }));


saveData();



/* ============================================================
   SAVE
============================================================ */

function saveData() {

    localStorage.setItem(
        "myCoffeeDiary",
        JSON.stringify(cafes)
    );

}



/* ============================================================
   MODAL
============================================================ */

function openModal(id = null) {


    document
        .getElementById("coffeeModal")
        .classList.add("show");


    document
        .getElementById("coffeeForm")
        .reset();


    document
        .getElementById("editId")
        .value = "";


    currentRating = 0;

    selectedCover = "";

    selectedGallery = [];

    selectedMenuImages = [];


    clearPreviews();


    document
        .getElementById("modalTitle")
        .textContent =
            "Thêm quán cà phê";


    /*
        Nếu đang chỉnh sửa
    */

    if (id !== null) {


        const cafe =
            cafes.find(
                c =>
                    c.id === id
            );


        if (!cafe) return;


        document
            .getElementById("modalTitle")
            .textContent =
                "Chỉnh sửa quán";


        document
            .getElementById("editId")
            .value =
                cafe.id;


        document
            .getElementById("name")
            .value =
                cafe.name || "";


        document
            .getElementById("city")
            .value =
                cafe.city || "";


        document
            .getElementById("district")
            .value =
                cafe.district || "";


        document
            .getElementById("ward")
            .value =
                cafe.ward || "";


        document
            .getElementById("page")
            .value =
                cafe.page || "";


        document
            .getElementById("category")
            .value =
                cafe.category ||
                "visited";


        document
            .getElementById("note")
            .value =
                cafe.note || "";


        currentRating =
            cafe.rating || 0;


        /*
            Giữ ảnh cũ
        */

        selectedCover =
            cafe.coverImage || "";


        selectedGallery =
            Array.isArray(cafe.gallery)
                ? [...cafe.gallery]
                : [];


        selectedMenuImages =
            Array.isArray(cafe.menuImages)
                ? [...cafe.menuImages]
                : [];


        updateStars();

        renderPreviews();

    }

}



/* ============================================================
   CLOSE MODAL
============================================================ */

function closeModal() {

    document
        .getElementById("coffeeModal")
        .classList.remove("show");

}



/* ============================================================
   RATING
============================================================ */

function setRating(number) {

    currentRating = number;

    updateStars();

}


function updateStars() {

    document
        .querySelectorAll(".star")
        .forEach(star => {

            const value =
                Number(
                    star.dataset.value
                );


            star.classList.toggle(
                "selected",
                value <= currentRating
            );

        });

}



/* ============================================================
   COVER IMAGE
============================================================ */

document
    .getElementById("coverImage")
    .addEventListener(
        "change",
        function() {


            const file =
                this.files[0];


            if (!file) return;


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    selectedCover =
                        e.target.result;

                    renderPreviews();

                };


            reader.readAsDataURL(
                file
            );

        }
    );



/* ============================================================
   GALLERY - MAX 8
============================================================ */

document
    .getElementById("galleryImages")
    .addEventListener(
        "change",
        function() {


            const files =
                Array.from(
                    this.files
                );


            if (
                selectedGallery.length +
                files.length >
                8
            ) {

                alert(
                    "Mỗi quán chỉ được tối đa 8 ảnh album."
                );

                this.value = "";

                return;

            }


            let processed = 0;


            files.forEach(
                file => {


                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            selectedGallery.push(
                                e.target.result
                            );


                            processed++;


                            if (
                                processed ===
                                files.length
                            ) {

                                renderPreviews();

                            }

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );


        }
    );



/* ============================================================
   MENU IMAGES
============================================================ */

document
    .getElementById("menuImages")
    .addEventListener(
        "change",
        function() {


            const files =
                Array.from(
                    this.files
                );


            let processed = 0;


            files.forEach(
                file => {


                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            selectedMenuImages.push(
                                e.target.result
                            );


                            processed++;


                            if (
                                processed ===
                                files.length
                            ) {

                                renderPreviews();

                            }

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );


        }
    );



/* ============================================================
   PREVIEW
============================================================ */

function clearPreviews() {

    document
        .getElementById("coverPreview")
        .innerHTML = "";


    document
        .getElementById("galleryPreview")
        .innerHTML = "";


    document
        .getElementById("menuPreview")
        .innerHTML = "";

}



function renderPreviews() {


    /*
        COVER
    */

    const coverPreview =
        document
            .getElementById(
                "coverPreview"
            );


    coverPreview.innerHTML = "";


    if (selectedCover) {

        coverPreview.innerHTML = `

            <div class="preview-box">

                <img
                    src="${selectedCover}"
                    alt="Cover"
                >

            </div>

        `;

    }



    /*
        GALLERY
    */

    const galleryPreview =
        document
            .getElementById(
                "galleryPreview"
            );


    galleryPreview.innerHTML = "";


    selectedGallery
        .forEach(
            (image,index) => {

                galleryPreview.innerHTML += `

                    <div class="preview-box">

                        <img
                            src="${image}"
                            alt="Gallery ${index+1}"
                        >

                    </div>

                `;

            }
        );



    /*
        MENU
    */

    const menuPreview =
        document
            .getElementById(
                "menuPreview"
            );


    menuPreview.innerHTML = "";


    selectedMenuImages
        .forEach(
            image => {

                menuPreview.innerHTML += `

                    <div class="preview-box">

                        <img
                            src="${image}"
                            alt="Menu"
                        >

                    </div>

                `;

            }
        );

}



/* ============================================================
   SUBMIT FORM
============================================================ */

document
    .getElementById("coffeeForm")
    .addEventListener(
        "submit",
        function(event) {


            event.preventDefault();


            const editId =
                document
                    .getElementById(
                        "editId"
                    )
                    .value;


            const cafeData = {


                name:
                    document
                        .getElementById(
                            "name"
                        )
                        .value
                        .trim(),


                city:
                    document
                        .getElementById(
                            "city"
                        )
                        .value
                        .trim(),


                district:
                    document
                        .getElementById(
                            "district"
                        )
                        .value
                        .trim(),


                ward:
                    document
                        .getElementById(
                            "ward"
                        )
                        .value
                        .trim(),


                page:
                    document
                        .getElementById(
                            "page"
                        )
                        .value
                        .trim(),


                category:
                    document
                        .getElementById(
                            "category"
                        )
                        .value,


                rating:
                    currentRating,


                note:
                    document
                        .getElementById(
                            "note"
                        )
                        .value
                        .trim(),


                coverImage:
                    selectedCover,


                gallery:
                    selectedGallery,


                menuImages:
                    selectedMenuImages

            };



            /*
                EDIT
            */

            if (editId) {


                const index =
                    cafes.findIndex(
                        cafe =>
                            cafe.id ==
                            editId
                    );


                if (index !== -1) {


                    cafeData.id =
                        cafes[index].id;


                    cafeData.favorite =
                        cafes[index]
                            .favorite ||
                        false;


                    cafes[index] =
                        cafeData;

                }


            }


            /*
                ADD
            */

            else {


                cafeData.id =
                    Date.now();


                cafeData.favorite =
                    false;


                cafes.unshift(
                    cafeData
                );

            }



            saveData();


            closeModal();


            /*
                QUAN TRỌNG:
                cập nhật bộ lọc ngay sau khi
                thêm quán mới.
            */

            refreshFilters();


            renderCafes(false);

        }
    );



/* ============================================================
   DELETE
============================================================ */

function deleteCafe(id) {


    const cafe =
        cafes.find(
            c =>
                c.id === id
        );


    if (!cafe) return;


    const confirmed =
        confirm(
            `Bạn có chắc muốn xóa "${cafe.name}" không?`
        );


    if (!confirmed) return;


    cafes =
        cafes.filter(
            c =>
                c.id !== id
        );


    saveData();


    refreshFilters();


    renderCafes(false);

}



/* ============================================================
   FAVORITE
============================================================ */

function toggleFavorite(id) {


    const cafe =
        cafes.find(
            c =>
                c.id === id
        );


    if (!cafe) return;


    cafe.favorite =
        !cafe.favorite;


    saveData();


    renderCafes(false);

}



/* ============================================================
   CATEGORY
============================================================ */

function changeCategory(
    category,
    button
) {


    currentCategory =
        category;


    document
        .querySelectorAll(".tab")
        .forEach(
            tab =>
                tab.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    renderCafes(false);

}



/* ============================================================
   GET FILTERED
============================================================ */

function getFilteredCafes() {


    const search =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();


    const city =
        document
            .getElementById(
                "cityFilter"
            )
            .value;


    const district =
        document
            .getElementById(
                "districtFilter"
            )
            .value;


    const ward =
        document
            .getElementById(
                "wardFilter"
            )
            .value;



    return cafes.filter(
        cafe => {


            const text = [

                cafe.name,

                cafe.city,

                cafe.district,

                cafe.ward,

                cafe.note

            ]
                .join(" ")
                .toLowerCase();


            const matchesSearch =
                text.includes(
                    search
                );


            const matchesCity =
                !city ||
                cafe.city === city;


            const matchesDistrict =
                !district ||
                cafe.district === district;


            const matchesWard =
                !ward ||
                cafe.ward === ward;


            let matchesCategory =
                true;


            if (
                currentCategory ===
                "favorite"
            ) {

                matchesCategory =
                    cafe.favorite;

            }

            else if (
                currentCategory !==
                "all"
            ) {

                matchesCategory =
                    cafe.category ===
                    currentCategory;

            }


            return (

                matchesSearch &&

                matchesCity &&

                matchesDistrict &&

                matchesWard &&

                matchesCategory

            );

        }
    );

}



/* ============================================================
   RENDER CAFES
============================================================ */

function renderCafes(
    updateFilters = false
) {


    if (updateFilters) {

        refreshFilters();

    }


    const grid =
        document
            .getElementById(
                "coffeeGrid"
            );


    const filtered =
        getFilteredCafes();


    updateStats();



    if (
        filtered.length === 0
    ) {


        grid.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ☕
                </div>

                <h3>
                    Chưa tìm thấy quán nào
                </h3>

                <p>
                    Hãy thử thay đổi bộ lọc
                    hoặc thêm một quán mới nhé!
                </p>

            </div>

        `;


        return;

    }



    grid.innerHTML =
        filtered
            .map(
                createCafeCard
            )
            .join("");

}



/* ============================================================
   CREATE CARD
============================================================ */

function createCafeCard(cafe) {


    const rating =
        Number(
            cafe.rating || 0
        );


    const stars =
        "★".repeat(
            rating
        ) +

        "☆".repeat(
            5 - rating
        );



    const categoryNames = {

        visited:
            "📍 Đã đi",

        wishlist:
            "✨ Wishlist",

        avoid:
            "🚫 Không nên đi"

    };



    const location =
        [

            cafe.ward,

            cafe.district,

            cafe.city

        ]
            .filter(Boolean)
            .join(", ");



    /*
        ALBUM
    */

    const gallery =
        Array.isArray(
            cafe.gallery
        )
            ? cafe.gallery
            : [];



    const albumHTML =
        gallery.length

        ?

        `

        <div class="album">

            ${

                gallery
                    .map(
                        (image,index) => `

                            <img
                                class="album-thumb"
                                src="${image}"
                                alt="Ảnh ${index+1}"
                                onclick="openImageViewer('${image}')"
                            >

                        `
                    )
                    .join("")

            }

        </div>

        `

        :

        "";



    /*
        MENU
    */

    const menuImages =
        Array.isArray(
            cafe.menuImages
        )
            ? cafe.menuImages
            : [];



    const menuHTML =
        menuImages.length

        ?

        `

        <div class="menu-section">

            <div class="menu-title">
                📖 Menu
            </div>


            <div class="menu-images">

                ${

                    menuImages
                        .map(
                            image => `

                                <img
                                    class="menu-image"
                                    src="${image}"
                                    alt="Menu"
                                    onclick="openImageViewer('${image}')"
                                >

                            `
                        )
                        .join("")

                }

            </div>

        </div>

        `

        :

        "";



    return `

        <article class="coffee-card">


            <div class="cover-wrapper">


                ${
                    cafe.coverImage

                    ?

                    `

                    <img
                        class="cover-image"
                        src="${cafe.coverImage}"
                        alt="${escapeHtml(cafe.name)}"
                        onclick="openImageViewer('${cafe.coverImage}')"
                        style="cursor:pointer"
                    >

                    `

                    :

                    `

                    <div class="no-image">
                        ☕
                    </div>

                    `

                }


                <button
                    class="favorite-btn"
                    onclick="toggleFavorite(${cafe.id})"
                    title="Yêu thích"
                >

                    ${
                        cafe.favorite
                            ? "❤️"
                            : "♡"
                    }

                </button>


            </div>



            ${albumHTML}



            <div class="card-body">


                <h3 class="card-title">

                    ${escapeHtml(
                        cafe.name
                    )}

                </h3>



                <div class="location">

                    📍

                    ${escapeHtml(
                        location
                    )}

                </div>



                <div class="rating">

                    ${stars}

                    <span
                        class="rating-number"
                    >

                        ${rating}/5

                    </span>

                </div>



                <span class="tag">

                    ${
                        categoryNames[
                            cafe.category
                        ] ||
                        cafe.category
                    }

                </span>



                ${menuHTML}



                ${
                    cafe.note

                    ?

                    `

                    <p class="note">

                        ${escapeHtml(
                            cafe.note
                        )}

                    </p>

                    `

                    :

                    ""

                }



                ${
                    cafe.page

                    ?

                    `

                    <a
                        href="${escapeAttribute(cafe.page)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                            display:inline-block;
                            margin-top:12px;
                            color:#6F4E37;
                            font-size:13px;
                            text-decoration:none;
                            font-weight:600;
                        "
                    >

                        🔗 Xem Page

                    </a>

                    `

                    :

                    ""

                }



                <div class="card-actions">


                    <button
                        class="small-btn edit-btn"
                        onclick="openModal(${cafe.id})"
                    >

                        ✏️ Sửa

                    </button>


                    <button
                        class="small-btn delete-btn"
                        onclick="deleteCafe(${cafe.id})"
                    >

                        🗑️ Xóa

                    </button>


                </div>


            </div>


        </article>

    `;

}



/* ============================================================
   STATISTICS
============================================================ */

function updateStats() {


    document
        .getElementById(
            "totalCount"
        )
        .textContent =
            cafes.length;


    document
        .getElementById(
            "visitedCount"
        )
        .textContent =

            cafes.filter(
                cafe =>
                    cafe.category ===
                    "visited"
            ).length;


    document
        .getElementById(
            "favoriteCount"
        )
        .textContent =

            cafes.filter(
                cafe =>
                    cafe.favorite
            ).length;


    document
        .getElementById(
            "wishlistCount"
        )
        .textContent =

            cafes.filter(
                cafe =>
                    cafe.category ===
                    "wishlist"
            ).length;

}



/* ============================================================
   IMPORTANT:
   REFRESH FILTERS
============================================================ */

function refreshFilters() {


    /*
        Lưu lựa chọn hiện tại
        trước khi cập nhật.
    */

    const oldCity =
        document
            .getElementById(
                "cityFilter"
            )
            .value;


    const oldDistrict =
        document
            .getElementById(
                "districtFilter"
            )
            .value;


    const oldWard =
        document
            .getElementById(
                "wardFilter"
            )
            .value;



    /*
        CITY
    */

    const cities =
        [
            ...new Set(

                cafes
                    .map(
                        cafe =>
                            cafe.city
                    )
                    .filter(Boolean)

            )
        ]
            .sort();


    const citySelect =
        document
            .getElementById(
                "cityFilter"
            );


    citySelect.innerHTML = `

        <option value="">
            Tất cả thành phố
        </option>

        ${

            cities
                .map(
                    city => `

                        <option
                            value="${escapeAttribute(city)}"
                        >
                            ${escapeHtml(city)}
                        </option>

                    `
                )
                .join("")

        }

    `;



    /*
        Nếu thành phố cũ
        vẫn tồn tại thì giữ lại.
    */

    if (
        cities.includes(
            oldCity
        )
    ) {

        citySelect.value =
            oldCity;

    }



    /*
        DISTRICT
    */

    updateDistrictFilter(
        oldDistrict,
        oldWard
    );

}



/* ============================================================
   DISTRICT FILTER
============================================================ */

function updateDistrictFilter(
    keepDistrict = "",
    keepWard = ""
) {


    const city =
        document
            .getElementById(
                "cityFilter"
            )
            .value;


    const districts =
        [
            ...new Set(

                cafes

                    .filter(
                        cafe =>
                            !city ||
                            cafe.city === city
                    )

                    .map(
                        cafe =>
                            cafe.district
                    )

                    .filter(Boolean)

            )
        ]
            .sort();


    const select =
        document
            .getElementById(
                "districtFilter"
            );


    select.innerHTML = `

        <option value="">
            Tất cả quận
        </option>

        ${

            districts
                .map(
                    district => `

                        <option
                            value="${escapeAttribute(district)}"
                        >
                            ${escapeHtml(district)}
                        </option>

                    `
                )
                .join("")

        }

    `;



    /*
        Đây chính là phần sửa lỗi:
        quận vừa nhập sẽ xuất hiện
        trong "Tất cả quận".
    */

    if (
        districts.includes(
            keepDistrict
        )
    ) {

        select.value =
            keepDistrict;

    }



    updateWardFilter(
        keepWard
    );

}



/* ============================================================
   WARD FILTER
============================================================ */

function updateWardFilter(
    keepWard = ""
) {


    const city =
        document
            .getElementById(
                "cityFilter"
            )
            .value;


    const district =
        document
            .getElementById(
                "districtFilter"
            )
            .value;


    const wards =
        [
            ...new Set(

                cafes

                    .filter(
                        cafe =>

                            (!city ||
                                cafe.city === city)

                            &&

                            (!district ||
                                cafe.district === district)

                    )

                    .map(
                        cafe =>
                            cafe.ward
                    )

                    .filter(Boolean)

            )
        ]
            .sort();


    const select =
        document
            .getElementById(
                "wardFilter"
            );


    select.innerHTML = `

        <option value="">
            Tất cả phường
        </option>

        ${

            wards
                .map(
                    ward => `

                        <option
                            value="${escapeAttribute(ward)}"
                        >
                            ${escapeHtml(ward)}
                        </option>

                    `
                )
                .join("")

        }

    `;



    if (
        wards.includes(
            keepWard
        )
    ) {

        select.value =
            keepWard;

    }

}



/* ============================================================
   CITY CHANGE
============================================================ */

function handleCityChange() {


    /*
        Khi đổi thành phố,
        reset quận + phường.
    */

    updateDistrictFilter();

    renderCafes(false);

}



/* ============================================================
   DISTRICT CHANGE
============================================================ */

function handleDistrictChange() {


    /*
        Khi đổi quận,
        cập nhật phường.
    */

    updateWardFilter();

    renderCafes(false);

}



/* ============================================================
   IMAGE VIEWER
============================================================ */

function openImageViewer(
    image
) {


    document
        .getElementById(
            "viewerImage"
        )
        .src = image;


    document
        .getElementById(
            "imageViewer"
        )
        .classList.add(
            "show"
        );

}


function closeImageViewer() {


    document
        .getElementById(
            "imageViewer"
        )
        .classList.remove(
            "show"
        );

}



/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
    text
) {


    if (!text)
        return "";


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



function escapeAttribute(
    text
) {

    return escapeHtml(
        text
    );

}



/* ============================================================
   CLICK OUTSIDE MODAL
============================================================ */

document
    .getElementById(
        "coffeeModal"
    )
    .addEventListener(
        "click",
        function(event) {


            if (
                event.target ===
                this
            ) {

                closeModal();

            }

        }
    );

    )
    .addEventListener(
        "click",
        function(event) {


            if (
                event.target ===
                this
            ) {

                closeImageViewer();

            }

        }
    );



/* ============================================================

============================================================ */

refreshFilters();

renderCafes(false);
